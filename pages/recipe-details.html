<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../src/assets/illustrations/favicon/favicon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Coiny&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/assets/styles/style.css" />
    <title>Recipe Search</title>
  </head>
  <body>
    <main>
      <div class="recipe-preview">
        <div class="image-wrap">
          <img alt="" src="" class="recipe-preview__image" />
          <button class="fav-btn button--favorites">Add to favorites</button>
        </div>
        <div class="content">
          <div class="info-block content__main-info">
            <h1></h1>
            <div class="info__times"></div>
            <div class="info__tags-wrap">
              <div class="info__diet-tags">
                <p>Diet:</p>
              </div>
              <div class="info__meal-tags">
                <p>Meal:</p>
              </div>
            </div>
            <div class="info__servings-wrap">
              <p class="info__servings-text">Choose servings amount:</p>
              <div class="info__servings-amount">
                <button
                  class="button button--prim button--icon-before button--plan"
                >
                  Add to plan
                </button>
              </div>
            </div>
          </div>
          <div class="info-block ingredients">
            <h2>Ingredients</h2>
            <div class="ingredients__wrap"></div>
          </div>
          <div class="info-block steps">
            <h2>Steps</h2>
            <div class="steps__wrap"></div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <p>Copyright © Adriana Szetlak 2026</p>
    </footer>
    <script src="../dist/pageManager/recipeDetails.js" type="module"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../src/assets/illustrations/favicon/favicon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Coiny&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/assets/styles/style.css" />
    <title>Recipe Search</title>
  </head>
  <body>
    <main>
      <div class="recipe-search">
        <div class="recipe-search__inputs">
          <button class="button button--sec button--icon-before button--clear">
            Clear search
          </button>
          <button
            class="button button--prim button--icon-after button--show-filters"
          >
            Show filters
          </button>
        </div>
        <div class="recipe-search__categories">
          <div class="recipe-search__categories-container">
            <div class="recipe-search__category recipe-search__category--diet">
              <p class="recipe-search__category-label">Diet</p>
              <div class="recipe-search__category-list"></div>
            </div>
            <div class="recipe-search__category recipe-search__category--meal">
              <p class="recipe-search__category-label">Meal Types</p>
              <div class="recipe-search__category-list"></div>
            </div>
            <button class="button button--prim button--apply">
              Apply filters
            </button>
          </div>
        </div>
      </div>
      <div class="recipe-list"></div>
    </main>
    <footer>
      <p>Copyright © Adriana Szetlak 2026</p>
    </footer>
    <script src="../dist/pageManager/searchPage.js" type="module"></script>
  </body>
</html>
